name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 7 * * 1'

permissions:
  contents: read

jobs:
  dependencies:
    name: Dependency vulnerability review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Test audit review policy
        run: pnpm test:dependency-audit
      - name: Review all, production and development dependency scopes
        run: pnpm audit:dependencies
      - name: Reject known critical dependency vulnerabilities
        run: pnpm audit --audit-level=critical
      - name: Save secret-free audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-audit
          path: test-results/dependency-audit.json
          retention-days: 30
          if-no-files-found: warn
  quality:
    name: Quality and security regression checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name != 'schedule'
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: vaultmaster_test
          POSTGRES_PASSWORD: vaultmaster_test
          POSTGRES_DB: vaultmaster_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vaultmaster_test -d vaultmaster_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://vaultmaster_test:vaultmaster_test@localhost:5432/vaultmaster_test
      DATABASE_DIRECT_URL: postgresql://vaultmaster_test:vaultmaster_test@localhost:5432/vaultmaster_test
      VAULTMASTER_TEST_DATABASE_URL: postgresql://vaultmaster_test:vaultmaster_test@localhost:5432/vaultmaster_test
      JWT_SECRET: ci-access-token-secret-not-for-production
      JWT_REFRESH_SECRET: ci-refresh-token-secret-not-for-production
      APP_ENCRYPTION_KEY: Iqgdnj6zTOno1qTzP6+46sh4Vhvs13bWVeLD5TbLWXA=
      API_PORT: '4000'
      CORS_ORIGIN: http://localhost:3000
      VAULTMASTER_STATIC_EXPORT: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify recovery drill isolation guards
        run: pnpm test:backup-drill-safety
      - name: Test health alert thresholds, rollback abort policy and privacy boundaries
        run: pnpm --filter @vaultmaster/shared build && pnpm test:observability
      - name: Check extension documentation, links and terminology
        run: pnpm test:docs
      - name: Generate Prisma client
        run: pnpm --filter @vaultmaster/api db:generate
      - name: Apply migrations to the test database
        run: pnpm --filter @vaultmaster/api db:deploy
      - name: Lint and typecheck
        run: pnpm lint && pnpm typecheck
      - name: Build all packages and the static web app
        run: NODE_ENV=production pnpm build
      - name: Verify reproducible extension release archives
        run: |
          pnpm package:extension test-results/extension-first.zip
          pnpm package:extension test-results/extension-second.zip
          cmp test-results/extension-first.zip test-results/extension-second.zip
          pnpm verify:extension test-results/extension-first.zip
      - name: Install recovery tools and verify unsafe historical rollback is blocked
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql postgresql-client
          node --test scripts/tests/key-exchange-rollback.test.mjs
      - name: Run unit and database integration tests
        run: pnpm test
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Test the web app and real browser extension
        run: pnpm test:web:browser && pnpm test:extension:browser
      - name: Verify client sharing and emergency recovery with isolated API and Chromium
        run: bash scripts/key-exchange-checks.sh
