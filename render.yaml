services:
  - type: web
    name: vaultmaster-api
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: corepack enable && pnpm install --frozen-lockfile --prod=false && pnpm --filter @vaultmaster/api db:generate && pnpm --filter @vaultmaster/api... build
    startCommand: pnpm --filter @vaultmaster/api db:deploy && pnpm --filter @vaultmaster/api start
    healthCheckPath: /api/health/ready
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_DIRECT_URL
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: APP_ENCRYPTION_KEY
        generateValue: true
